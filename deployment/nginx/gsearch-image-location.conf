# Include inside each public GSearch server block, before the /api/ location.
location ^~ /media/gcores/ {
    limit_except GET HEAD { deny all; }
    if ($gsearch_image_target = "") { return 400; }

    # Example for systemd-resolved; use the DNS resolver available on your host.
    resolver 127.0.0.53 valid=60s ipv6=off;
    resolver_timeout 5s;
    proxy_pass https://image.gcores.com$gsearch_image_target;
    proxy_ssl_server_name on;
    proxy_ssl_name image.gcores.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host image.gcores.com;
    proxy_set_header Referer https://www.gcores.com/;
    proxy_set_header User-Agent GSearch-Image-Proxy;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 25s;

    proxy_cache gsearch_images;
    proxy_cache_key $gsearch_image_target;
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_lock_age 20s;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_hide_header Set-Cookie;
    proxy_hide_header X-Powered-By;
    add_header X-GSearch-Image-Cache $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; upgrade-insecure-requests; block-all-mixed-content" always;
}
