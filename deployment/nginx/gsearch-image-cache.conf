# Install in /etc/nginx/conf.d/ (http context).
proxy_cache_path /var/cache/nginx/gsearch-images levels=1:2
    keys_zone=gsearch_images:10m max_size=512m inactive=30d use_temp_path=off;

# Preserve the original escaped path and query. The upstream hostname is fixed.
map $request_uri $gsearch_image_target {
    default "";
    ~^/media/gcores/(?<gsearch_image_path>.*)$ /$gsearch_image_path;
}
